image: maven:3.8.6-openjdk-11

cache:
  paths:
    - .m2/repository

variables:
  OPTS: >
        -quiet
        -Djavac.compilerargs=-nowarn
        -Dbuild.compiler.deprecation=false
        -Dcluster.config=streamsim
        -Dreleasejson=../netbeansrelease.json
        -Dmetabuild.branch=release160-streamsim
        -Duse.pack200=false
  # This will suppress any download for dependencies and plugins or upload messages which would clutter the console log.
  # `showDateTime` will show the passed time in milliseconds. You need to specify `--batch-mode` to make this work.
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  # As of Maven 3.3.0 instead of this you may define these options in `.mvn/maven.config` so the same config is used
  # when running from the command line.
  # `installAtEnd` and `deployAtEnd` are only effective with recent version of the corresponding plugins.
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'

stages:
  - build_stage
  - deploy_stage

build:
  stage: build_stage
  script:
    - apt-get -qq update
    - apt-get install ant zip -y
    # build NetBeans Platform, NBMs and source zips
    - ant $OPTS build build-nbms build-source-zips
    # remove offending .xml files
    - rm -f nbbuild/netbeans/platform/config/Modules/org-netbeans-libs-batik-read.xml
    - rm -f nbbuild/netbeans/platform/config/Modules/org-openide-util-ui-svg.xml
    # add dlight cluster, NBMs and source zips from NetBeans 8.2
    - wget -q https://s3.amazonaws.com/backup-streamsim.net/archive/netbeans-8.2-dlight-cluster-nbms-sourcezips.zip
    - unzip -q netbeans-8.2-dlight-cluster-nbms-sourcezips.zip
    # add JavaHelp
    - wget -q https://s3.amazonaws.com/backup-streamsim.net/archive/jsearch-2.0_05.jar.zip
    - unzip -q jsearch-2.0_05.jar.zip
    - cp jsearch-2.0_05.jar nbbuild/netbeans/harness/antlib/
    # build zip
    - cd nbbuild && zip -r netbeans-release160-streamsim.zip netbeans && cd ..
    # build nbms zip
    - cd nbbuild && zip -r netbeans-nbms-release160-streamsim.zip nbms && cd ..
  artifacts:
      paths:
        - nbbuild/netbeans
        - nbbuild/nbms
        - nbbuild/netbeans-release160-streamsim.zip
        - nbbuild/netbeans-nbms-release160-streamsim.zip

deploy:
  stage: deploy_stage
  script:
    - if [ ! -f ci_settings.xml ];
      then echo "CI settings missing\! If deploying to GitLab Maven Repository, please see https://docs.gitlab.com/ee/user/packages/maven_repository/index.html#create-maven-packages-with-gitlab-cicd for instructions.";
      fi
    - 'mvn $MAVEN_CLI_OPTS nb-repository:populate -s ci_settings.xml'
